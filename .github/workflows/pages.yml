# Publica o Faster GM no GitHub Pages a cada push na main.
# Para funcionar: Settings > Pages > Source: GitHub Actions (uma vez só).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  # Banco das contas: aplica a migração num Postgres limpo, roda os testes, desfaz e aplica de novo.
  banco:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -q -f supabase/tests/supabase-local.sql
      - run: psql -v ON_ERROR_STOP=1 -q -f supabase/migrations/20261112000000_contas.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/contas.sql
      - run: |
          psql -v ON_ERROR_STOP=1 -q -f supabase/rollback/20261112000000_contas.sql
          psql -v ON_ERROR_STOP=1 -q -f supabase/migrations/20261112000000_contas.sql
  deploy:
    needs: [build, banco]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
